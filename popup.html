<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Prompt Queuer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            width: 420px;
            min-height: 480px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container { padding: 18px; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { margin: 0 0 6px; font-size: 18px; }
        .header p { margin: 0; font-size: 12px; opacity: 0.8; }
        .mode-selector {
            display: flex;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 2px;
        }
        .mode-button {
            flex: 1;
            border: none;
            background: transparent;
            color: white;
            padding: 9px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .mode-button.active {
            background: rgba(255,255,255,0.2);
            font-weight: 600;
        }
        .progress {
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .status {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4CAF50;
            transition: width 0.2s ease;
        }
        .queue-list {
            max-height: 220px;
            overflow-y: auto;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            margin-bottom: 6px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            font-size: 12px;
        }
        .queue-item:last-child { margin-bottom: 0; }
        .queue-item.processing { border-left: 3px solid #ff9800; }
        .queue-item.completed { border-left: 3px solid #4CAF50; }
        .queue-index {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }
        .queue-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .queue-status { font-size: 12px; }
        .empty-state {
            text-align: center;
            padding: 20px 10px;
            font-size: 12px;
            opacity: 0.75;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 11px;
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-value {
            display: block;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .tab-list { margin-bottom: 12px; }
        .tab-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            margin-bottom: 6px;
            font-size: 11px;
        }
        .tab-info:last-child { margin-bottom: 0; }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9e9e9e;
        }
        .status-indicator.active { background: #4CAF50; }
        .button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 11px 12px;
            margin-bottom: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
        }
        .button.primary { background: #4CAF50; }
        .button.warning { background: #ff9800; }
        .button.danger { background: #f44336; }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .muted { font-size: 11px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Prompt Queue</h1>
            <p>ChatGPT queue status and controls</p>
        </div>

        <div class="mode-selector">
            <button class="mode-button active" data-mode="single">Single Tab</button>
            <button class="mode-button" data-mode="multi">Multi Tab</button>
        </div>

        <div class="progress" id="progress" style="display:none;">
            <div class="status" id="status">Processing...</div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="status" id="progress-text">0 / 0</div>
        </div>

        <div class="queue-list" id="queue-list">
            <div class="empty-state">No prompts in queue</div>
        </div>

        <div class="stats" id="multi-stats" style="display:none;">
            <div class="stat-item"><span class="stat-value" id="active-tabs-count">0</span><span>Tabs</span></div>
            <div class="stat-item"><span class="stat-value" id="queue-length">0</span><span>Queued</span></div>
            <div class="stat-item"><span class="stat-value" id="completed-count">0</span><span>Done</span></div>
        </div>

        <div class="tab-list" id="tabs-info" style="display:none;"></div>

        <div class="progress" id="multi-progress" style="display:none;">
            <div class="status" id="multi-status">Processing across multiple tabs...</div>
            <div class="progress-bar"><div class="progress-fill" id="multi-progress-fill"></div></div>
            <div class="status" id="multi-progress-text">0 / 0</div>
        </div>

        <button class="button primary" id="start-queue" disabled>Start Queue</button>
        <button class="button warning" id="stop-queue" disabled>Stop Queue</button>
        <button class="button danger" id="clear-queue">Clear Queue</button>
        <button class="button" id="refresh-tabs">Refresh Tabs</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
